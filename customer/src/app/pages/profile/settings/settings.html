<div dir="rtl" class="min-h-[calc(100vh-4rem)] bg-[var(--bg-base)]">
  <div class="max-w-lg mx-auto px-4 md:px-6 py-6 md:py-8">
    <button (click)="back()" class="flex items-center gap-1.5 text-sm font-bold text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors mb-6">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span>العودة</span>
    </button>

    <h1 class="text-2xl font-extrabold text-[var(--text-primary)] mb-6">الملف الشخصي</h1>

    @if (saveSuccess()) {
      <p class="text-sm font-semibold text-emerald-600 bg-emerald-50 border border-emerald-200 px-4 py-3 rounded-2xl mb-4">{{ saveSuccess() }}</p>
    }

    @if (saveError()) {
      <p class="text-sm font-semibold text-red-600 bg-red-50 border border-red-200 px-4 py-3 rounded-2xl mb-4">{{ saveError() }}</p>
    }

    <div class="bg-[var(--bg-card)] rounded-3xl border border-[var(--border)] overflow-hidden">
      <div class="px-5 py-4 border-b border-[var(--border)]">
        <h2 class="text-sm font-bold text-[var(--text-primary)]">معلومات عامة</h2>
      </div>
      <div class="p-5 flex flex-col gap-4">
        <div>
          <label class="text-xs font-medium text-[var(--text-secondary)] block mb-1.5">الاسم الكامل</label>
          @if (editMode()) {
            <div class="flex items-center gap-2">
              <input type="text" [ngModel]="editName()" (ngModelChange)="editName.set($event)"
                class="flex-1 px-4 py-2.5 rounded-xl border border-[var(--border)] bg-[var(--bg-base)] text-sm font-semibold text-[var(--text-primary)] outline-none focus:border-[var(--primary)]"
                placeholder="الاسم">
              <button (click)="save()" [disabled]="isSaving()"
                class="px-4 py-2.5 rounded-xl bg-[var(--primary)] text-white text-sm font-bold active:scale-[0.98] transition-all"
                [class.opacity-60]="isSaving()">{{ isSaving() ? '...' : 'حفظ' }}</button>
              <button (click)="cancelEdit()"
                class="px-4 py-2.5 rounded-xl border border-[var(--border)] text-[var(--text-secondary)] text-sm font-bold active:scale-[0.98] transition-all">إلغاء</button>
            </div>
          } @else {
            <div class="flex items-center justify-between">
              <span class="text-sm font-semibold text-[var(--text-primary)]">{{ customerName() }}</span>
              <button (click)="startEdit()" class="text-xs font-bold text-[var(--primary)] active:scale-[0.98] transition-all">تعديل</button>
            </div>
          }
        </div>
      </div>
    </div>

    <div class="bg-[var(--bg-card)] rounded-3xl border border-[var(--border)] overflow-hidden mt-4">
      <div class="px-5 py-4 border-b border-[var(--border)]">
        <h2 class="text-sm font-bold text-[var(--text-primary)]">الحماية</h2>
      </div>
      <div class="p-5 flex flex-col gap-4">
        <div>
          <label class="text-xs font-medium text-[var(--text-secondary)] block mb-1.5">رقم الهاتف</label>
          <span class="text-sm font-semibold text-[var(--text-primary)]" dir="ltr">{{ customerPhone() || '—' }}</span>
        </div>
        <div>
          <label class="text-xs font-medium text-[var(--text-secondary)] block mb-1.5">البريد الإلكتروني</label>
          <span class="text-sm font-semibold text-[var(--text-primary)]">{{ customerEmail() || '—' }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
